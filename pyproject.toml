[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "me5418-robotic-harvesting"
version = "0.1.0"
description = "面向机器人采摘柔性障碍物交互的强化学习与规划研究"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
train = ["pandas>=2.2", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
