# Three decision regions, two lanes each: open detours versus soft/rigid gaps.
max_branches: 14
nodes_per_branch: 5
max_steps: 200
workspace_low: [0.0, 0.0]
workspace_high: [1.0, 1.0]
small_step: 0.025
large_step: 0.060
target_radius: 0.050
contact_radius: 0.035
relaxation_rate: 0.10
execution_noise_fraction: 0.0
show_gate_detail: false
# Certify an open route through actual physics before returning each reset.
verify_reference_route: true
reference_max_attempts: 10
scene:
  layout: multi_route
  tip_gap_range: [0.028, 0.043]
  stiffness_range: [0.35, 1.10]
  safe_limit_range: [0.075, 0.110]
  start_jitter: [0.010, 0.020]
  target_jitter: [0.010, 0.020]
  gate_x_jitter: 0.010
  twig_jitter: [0.005, 0.005]
reward:
  progress: 10.0
  deformation: 1.0
  travel: 0.2
  damage: 50.0
  success: 100.0
