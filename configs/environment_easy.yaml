# Navigation practice: one wide passage, two branches, no extra clutter.
# Keep five observation slots so the input dimension matches the default scene.
max_branches: 5
nodes_per_branch: 5
max_steps: 100
workspace_low: [0.0, 0.0]
workspace_high: [1.0, 1.0]
small_step: 0.025
large_step: 0.060
target_radius: 0.050
contact_radius: 0.035
relaxation_rate: 0.10
execution_noise_fraction: 0.0
show_gate_detail: false
scene:
  layout: easy_gate
  gap_height_range: [0.48, 0.52]
  tip_gap_range: [0.24, 0.30]
  stiffness_range: [0.35, 1.10]
  safe_limit_range: [0.075, 0.110]
  start_jitter: [0.015, 0.030]
  target_jitter: [0.015, 0.020]
  gate_x_jitter: 0.040
reward:
  progress: 10.0
  deformation: 1.0
  travel: 0.2
  damage: 50.0
  success: 100.0
