name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,network]"
      - run: ruff check .
      - run: pytest
      - run: python scripts/run_network_demo.py
      - run: python scripts/run_network_demo.py --config configs/environment_complex.yaml
      - run: python scripts/train_dqn.py --smoke --output-dir results/ci_default
      - run: python scripts/evaluate_dqn.py --checkpoint results/ci_default/latest.pt --episodes 2
      - run: python scripts/train_dqn.py --smoke --config configs/environment_complex.yaml --output-dir results/ci_complex
      - run: python scripts/evaluate_dqn.py --checkpoint results/ci_complex/latest.pt --episodes 2
      - run: python scripts/train_dqn.py --smoke --config configs/environment_easy.yaml --output-dir results/ci_easy
      - run: python scripts/evaluate_dqn.py --checkpoint results/ci_easy/latest.pt --episodes 2

